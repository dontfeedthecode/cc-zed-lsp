[package]
name = "zed-claude-skills"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"

# Detached from any ancestor workspace: Zed builds this directory directly and
# an outer Cargo.toml would move target/ and the lockfile out from under it.
[workspace]

[lib]
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
zed_extension_api = "0.7.0"

[profile.release]
opt-level = "s"
lto = true
strip = true
